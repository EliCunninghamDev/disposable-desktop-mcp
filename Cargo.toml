[package]
name = "xephyr-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MCP server driving a nested Xephyr/Xvfb desktop, plus an aspect-locked live viewer"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
gdk4-x11 = "0.9"
gtk4 = { version = "0.9", features = ["v4_10"] }
libc = "0.2"
png = "0.17"
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "io-util",
    "net",
    "process",
    "sync",
    "time",
    "signal",
] }
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
x11rb = { version = "0.13", features = ["randr", "xfixes", "xtest"] }
xkbcommon = "0.9.0"

[profile.release]
lto = "thin"
strip = true
